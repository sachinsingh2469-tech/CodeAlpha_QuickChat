<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quickchat • Login</title>
  <link rel="stylesheet" href="css/auth.css">
  <!-- GSAP for the Walking Peeps Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Walking Crowd Canvas Layer -->
  <canvas id="crowd-canvas"></canvas>

  <div class="auth-layout">
    <!-- Left: Glass Form -->
    <section class="auth-form-pane">
      <div class="form-container">
        <h1 id="form-title" class="brand-title">Quickchat</h1>
        <p id="form-sub" class="form-sub">Sign in to connect with friends and see what's happening.</p>

        <form id="auth-form">
          <div class="input-group" id="fullname-group" style="display: none;">
            <label>Full Name</label>
            <div class="glass-input">
              <input type="text" id="fullname" placeholder="Aarav Sharma">
            </div>
          </div>

          <div class="input-group" id="username-group" style="display: none;">
            <label>Username</label>
            <div class="glass-input">
              <input type="text" id="username" placeholder="aarav_sharma">
            </div>
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <div class="glass-input">
              <input type="email" id="email" placeholder="name@domain.com" required>
            </div>
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="glass-input password-wrap">
              <input type="password" id="password" placeholder="At least 8 characters" minlength="8" autocomplete="current-password" required>
              <button type="button" id="toggle-pwd" class="icon-btn">👁</button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <button type="button" class="btn-secondary" onclick="alert('Google Sign-in connected via OAuth')">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-2.6-.2-5.2-.6-7.7z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C42 35 44 30 44 24c0-2.6-.2-5.2-.6-7.7z"/></svg>
          Continue with Google
        </button>

        <p class="toggle-link">
          <span id="toggle-text">New to Quickchat?</span>
          <a href="#" id="toggle-mode">Create Account</a>
        </p>
      </div>
    </section>

    <!-- Right: Testimonial & Showcase -->
    <section class="auth-hero-pane">
      <div class="hero-image" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200');"></div>
      <div class="testimonial-container">
        <div class="testimonial-card">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="avatar">
          <div>
            <strong>Priya Sharma</strong> <span class="handle">@priyadigital</span>
            <p>Amazing platform! The user experience is clean, modern, and ultra fast.</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/crowd.js"></script>
  <script src="js/auth.js?v=2"></script>
</body>
</html>
